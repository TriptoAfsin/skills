<!-- product-promo: a live-footage shot with a title plate. Replace __ID__, the footage timing and the title words.
     Layout adapts to the frame: landscape puts the plate bottom-left over the footage; portrait and square put it
     in the band under the footage. Camera and cursor lines come from scripts/scene_motion.py. -->
<template>
  <style>
    @font-face { font-family: "Display"; src: url("assets/fonts/display.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Mono"; src: url("assets/fonts/mono.woff2") format("woff2"); font-weight: 100 900; }
    #root {
      /* tokens: the product's own theme (see references/look.md) */
      --ground: #0e1014; --stage-ground: #0b0d11; --line: #2a2f38; --text: #eceef2; --text-accent: #8fb0ff;
      --rec-w: 1882px; --rec-h: 1212px;           /* recording size */
      position: absolute; inset: 0; overflow: hidden; background: var(--stage-ground);
      font-family: "Display", system-ui, sans-serif; container-type: size;
    }
    #__ID__-stage { position: absolute; left: 0; top: 0; width: var(--rec-w); height: var(--rec-h); transform-origin: 0 0;
      border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 40px 90px rgba(0,0,0,0.55); }
    #__ID__-stage .vid { position: absolute; inset: 0; width: 100%; height: 100%; }
    .cursor { position: absolute; left: -6px; top: -4px; width: 72px; height: 72px; z-index: 3; opacity: 0; }
    .plate { position: absolute; z-index: 5; padding: 2cqmin 3.2cqmin; background: var(--ground); border: 1px solid var(--line);
      border-radius: 1.7cqmin; color: var(--text); font: 700 5.6cqmin/1.1 "Display", system-ui, sans-serif;
      letter-spacing: -0.02em; box-shadow: 0 18px 40px rgba(0,0,0,0.5); max-width: 86cqw; }
    .plate .w { display: inline-block; }
    .plate .acc { color: var(--text-accent); }
    #__ID__-title { left: 3.75cqw; bottom: 11cqh; }
    @container (aspect-ratio < 1.2) {               /* square, 4:5, 9:16: plate in the lower band, bigger type */
      .plate { font-size: 7.4cqw; padding: 3cqw 4.4cqw; border-radius: 2.4cqw; }
      #__ID__-title { left: 6cqw; right: auto; bottom: 14cqh; }
    }
  </style>
  <div id="root" data-composition-id="__ID__">
    <div id="__ID__-stage">
      <video id="__ID__-v0" class="clip vid" src="assets/footage/session.mp4" data-start="0" data-duration="4.0"
             data-media-start="0" data-playback-rate="1.0" muted playsinline></video>
      <svg id="__ID__-cur" class="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.6 L11.6 21.4 L14.4 20.2 L11.4 13.4 L17.6 13.4 Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </div>
    <div id="__ID__-title" class="plate"><span class="w">Finds</span> <span class="w acc">58.6</span> <span class="w">GB</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // paste scene_motion.py output here
    tl.fromTo("#__ID__-title", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 1.0);
    tl.fromTo("#__ID__-title .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 1.0);
    window.__timelines["__ID__"] = tl;
  </script>
</template>
